# Q1-isolated probe: ShortConv quant_config fix (PR #48917) on the SAME
# v0.22.1 base as the current best official submission (ERS 60.89), NOT
# v0.25.1. See Dockerfile.fp8-shortconv-quant-v0221-local for why this
# exists -- the first Q1 attempt (v0.25.1 base) scored WORSE (51.65) with
# TBT completely unchanged from baseline, which points at a v0.25.1
# regression confounding the ShortConv fix's own effect. This build isolates
# the fix alone on the known-good base image.
#
# BEFORE SUBMITTING: replace <DOCKERHUB_USER>/lfm-serving:fp8-shortconv-quant-v0221
# with the real pushed image tag.
services:
  model:
    image: <DOCKERHUB_USER>/lfm-serving:fp8-shortconv-quant-v0221
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --dtype=bfloat16
      - --quantization=fp8_per_tensor
      - --max-model-len=5120
      - --gpu-memory-utilization=0.70
      - --tensor-parallel-size=1
      - --max-num-seqs=8
      - --max-num-batched-tokens=512
      - --enable-prefix-caching
      - --prefix-caching-hash-algo=xxhash
      - --disable-log-stats
      - --disable-uvicorn-access-log
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
