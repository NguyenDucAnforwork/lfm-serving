# CPU-bottleneck candidate: decode metadata fast-path patch (baked into the
# image, see Dockerfile.fp8-metadata-fastpath-async-local) + async
# scheduling (--async-scheduling flag below). Same validated FP8 runtime
# flags as the 60.89 baseline otherwise; max_num_seqs stays at 8.
#
# KNOWN RISK -- read before submitting: a prior local probe on
# --async-scheduling with this same base config found 2/420 outputs
# containing gibberish/replacement-character fragments (session 10,
# EXPERIMENTS.md "Async scheduling probe"), despite good latency numbers.
# Re-verify output coherence before trusting any ERS improvement here --
# a fast score with corrupted output is not a real win.
#
# BEFORE SUBMITTING: replace <DOCKERHUB_USER>/lfm-serving:fp8-metadata-fastpath-async
# with the real pushed image tag.
services:
  model:
    image: <DOCKERHUB_USER>/lfm-serving:fp8-metadata-fastpath-async
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --dtype=bfloat16
      - --quantization=fp8_per_tensor
      - --max-model-len=5120
      - --gpu-memory-utilization=0.70
      - --tensor-parallel-size=1
      - --max-num-seqs=8
      - --max-num-batched-tokens=512
      - --enable-prefix-caching
      - --prefix-caching-hash-algo=xxhash
      - --disable-log-stats
      - --disable-uvicorn-access-log
      - --async-scheduling
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
