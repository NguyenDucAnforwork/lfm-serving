# Async scheduling candidate. Reuses the existing fp8-v1 image -- no new
# build/push needed, --async-scheduling is a pure vLLM CLI flag.
#
# KNOWN RISK -- read before submitting: a prior local probe on this exact
# flag/config combination (configs/fp8_async_scheduling.env, session 10,
# see EXPERIMENTS.md "Async scheduling probe") found 2/420 outputs
# contained gibberish/replacement-character fragments, despite good
# latency (ERS 69.5 local RTX 3090, TBT mean 2.78ms). That probe predates
# this session and was never re-verified for coherence -- a fast ERS
# number with corrupted output is not a real win. Re-check output text
# (e.g. via --keep-output-text on a local replay, or by inspecting a
# sample of H200 responses if the portal exposes them) before treating an
# async ERS improvement as trustworthy.
#
# Submit AFTER docker-compose.fp8-async-sync-seqs8.yml (explicit-sync
# control) so the async delta is measured against a same-day baseline.
services:
  model:
    image: siconhoccode/lfm-serving:fp8-v1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --dtype=bfloat16
      - --quantization=fp8_per_tensor
      - --max-model-len=5120
      - --gpu-memory-utilization=0.70
      - --tensor-parallel-size=1
      - --max-num-seqs=8
      - --max-num-batched-tokens=512
      - --enable-prefix-caching
      - --prefix-caching-hash-algo=xxhash
      - --disable-log-stats
      - --disable-uvicorn-access-log
      - --async-scheduling
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
