# Local/H200 fallback compose for the already-exported artifact:
#   artifacts/lfm2-w4a16-gptq-g64-late-mlp-bf16
#
# Known status from this server: 420 trace ran clean, but this did not pass
# promotion due GSM8K drop and one suspicious/coherence-bad trace output.
# Keep as fallback/debug image, not final submit.
services:
  model:
    image: YOUR_DOCKERHUB_USER/lfm-serving:w4a16-g64-late-mlp-bf16
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --dtype=bfloat16
      - --linear-backend=machete
      - --max-model-len=5120
      - --gpu-memory-utilization=0.70
      - --tensor-parallel-size=1
      - --max-num-seqs=8
      - --max-num-batched-tokens=512
      - --enable-prefix-caching
      - --prefix-caching-hash-algo=xxhash
      - --disable-log-stats
      - --disable-uvicorn-access-log
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
