# Hybrid-prefix retention ALONE (v0.25.1, no ShortConv patch, no async,
# no metadata fast-path). See Dockerfile.fp8-retention-only-local for
# full reasoning. Same validated FP8 runtime flags as the 60.89 baseline
# otherwise; max_num_seqs stays at 8.
#
# BEFORE SUBMITTING: replace <DOCKERHUB_USER>/lfm-serving:fp8-retention-only
# with the real pushed image tag.
services:
  model:
    image: <DOCKERHUB_USER>/lfm-serving:fp8-retention-only
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --dtype=bfloat16
      - --quantization=fp8_per_tensor
      - --max-model-len=5120
      - --gpu-memory-utilization=0.70
      - --tensor-parallel-size=1
      - --max-num-seqs=8
      - --max-num-batched-tokens=512
      - --enable-prefix-caching
      - --prefix-caching-hash-algo=xxhash
      - --disable-log-stats
      - --disable-uvicorn-access-log
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
