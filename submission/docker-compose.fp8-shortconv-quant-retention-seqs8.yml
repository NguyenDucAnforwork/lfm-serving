# Q2 probe: Q1 (ShortConv quant_config fix, PR #48917) + hybrid-prefix
# retention (PR #47782, already present in v0.25.1 -- see Dockerfile).
# Same validated FP8 runtime flags as Q1/the current best official
# submission; VLLM_PREFIX_CACHE_RETENTION_INTERVAL=0 is baked into the
# image via ENV, not set here, so it applies regardless of what the
# grading portal's compose passes through. max_num_seqs stays at 8 to
# isolate this candidate's effect from any scheduler change.
#
# BEFORE SUBMITTING: replace <DOCKERHUB_USER>/lfm-serving:fp8-shortconv-quant-retention
# with the real pushed image tag.
services:
  model:
    image: <DOCKERHUB_USER>/lfm-serving:fp8-shortconv-quant-retention
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --dtype=bfloat16
      - --quantization=fp8_per_tensor
      - --max-model-len=5120
      - --gpu-memory-utilization=0.70
      - --tensor-parallel-size=1
      - --max-num-seqs=8
      - --max-num-batched-tokens=512
      - --enable-prefix-caching
      - --prefix-caching-hash-algo=xxhash
      - --disable-log-stats
      - --disable-uvicorn-access-log
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
