# FP8 baseline with only LM-head changed to a runtime FP8 copy.
# Keeps max_num_seqs=8 to isolate the model-side effect from scheduler changes.
services:
  model:
    image: siconhoccode/lfm-serving:fp8-lmhead-v1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --dtype=bfloat16
      - --quantization=fp8_per_tensor
      - --max-model-len=5120
      - --gpu-memory-utilization=0.70
      - --tensor-parallel-size=1
      - --max-num-seqs=8
      - --max-num-batched-tokens=512
      - --enable-prefix-caching
      - --prefix-caching-hash-algo=xxhash
      - --disable-log-stats
      - --disable-uvicorn-access-log
    environment:
      LFM2_FP8_LM_HEAD: "1"
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
