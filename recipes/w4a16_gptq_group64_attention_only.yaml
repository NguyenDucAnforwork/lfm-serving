lfm2_w4a16_gptq_stage:
  quantization_modifiers:
    GPTQModifier:
      block_size: 128
      dampening_frac: 0.01
      actorder: static
      offload_hessians: true
      ignore:
        - lm_head
        - re:.*\.conv\..*
        # Conservative accuracy-recovery candidate: quantize only attention
        # Linear modules. Keep all gated MLP projections in BF16 after GSM8K
        # regressions persisted in broader W4 MLP candidates.
        - re:model\.layers\.[0-9]+\.feed_forward\.(w1|w2|w3)
      config_groups:
        group_0:
          targets:
            - Linear
          input_activations: null
          output_activations: null
          weights:
            num_bits: 4
            type: int
            symmetric: true
            strategy: group
            group_size: 64
