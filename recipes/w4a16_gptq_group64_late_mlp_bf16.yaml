lfm2_w4a16_gptq_stage:
  quantization_modifiers:
    GPTQModifier:
      block_size: 128
      dampening_frac: 0.01
      actorder: static
      offload_hessians: true
      ignore:
        - lm_head
        - re:.*\.conv\..*
        # Activation sensitivity on G64 full-W4 ranked late MLP outputs as the
        # dominant error source. Restore only layers 12-15 MLP projections.
        - re:model\.layers\.(12|13|14|15)\.feed_forward\.(w1|w2|w3)
      config_groups:
        group_0:
          targets:
            - Linear
          input_activations: null
          output_activations: null
          weights:
            num_bits: 4
            type: int
            symmetric: true
            strategy: group
            group_size: 64
