lfm2_w4a16_gptq_stage:
  quantization_modifiers:
    GPTQModifier:
      block_size: 128
      dampening_frac: 0.01
      actorder: static
      offload_hessians: true
      ignore:
        - lm_head
        - re:.*\.conv\..*
        # Follow-up to G64 MLP10-15 BF16. GSM8K still regressed by 4pp.
        # Activation error ranked layer 8 plus layers 10-15 MLP projections
        # as damaging, so restore MLP projections in layers 8-15.
        - re:model\.layers\.(8|9|10|11|12|13|14|15)\.feed_forward\.(w1|w2|w3)
      config_groups:
        group_0:
          targets:
            - Linear
          input_activations: null
          output_activations: null
          weights:
            num_bits: 4
            type: int
            symmetric: true
            strategy: group
            group_size: 64
