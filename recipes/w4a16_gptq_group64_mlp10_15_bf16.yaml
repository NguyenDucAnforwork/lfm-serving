lfm2_w4a16_gptq_stage:
  quantization_modifiers:
    GPTQModifier:
      block_size: 128
      dampening_frac: 0.01
      actorder: static
      offload_hessians: true
      ignore:
        - lm_head
        - re:.*\.conv\..*
        # Follow-up to G64 late-MLP-BF16. GSM8K still regressed and
        # activation/GPTQ error pointed at layer 10/11 MLP as additional
        # sensitive modules, so restore MLP projections in layers 10-15.
        - re:model\.layers\.(10|11|12|13|14|15)\.feed_forward\.(w1|w2|w3)
      config_groups:
        group_0:
          targets:
            - Linear
          input_activations: null
          output_activations: null
          weights:
            num_bits: 4
            type: int
            symmetric: true
            strategy: group
            group_size: 64
